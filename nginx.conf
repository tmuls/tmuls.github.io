server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Guides are fetched as .md files; serve them as text.
    types {
        text/markdown md;
    }
    include /etc/nginx/mime.types;

    location / {
        try_files $uri $uri/ =404;
    }

    # File names under /build/ change with each build, so they can be cached.
    location /build/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Lets Kubernetes check that the site is up.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
