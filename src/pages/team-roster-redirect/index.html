<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>VolleyRoster has moved</title>
<!-- VolleyRoster moved to its own site. Forward old links, keeping any
     roster data in the query string (?...) and hash so shared links still work. -->
<script>
  location.replace("https://volleyroster.com/" + location.search + location.hash);
</script>
<meta http-equiv="refresh" content="0; url=https://volleyroster.com/" />
</head>
<body>
  <p>VolleyRoster has moved to <a href="https://volleyroster.com/">volleyroster.com</a>.</p>
</body>
</html>
