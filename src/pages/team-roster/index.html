<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Team Roster</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Team Roster</h1>
    <form id="add-form" class="add-form">
      <input type="text" id="player-name" placeholder="Player name" maxlength="40" required />
      <button type="submit">Add Player</button>
    </form>
    <div class="header-actions">
      <button id="share-btn" type="button" title="Copy a shareable link with the current roster">Copy Share Link</button>
      <button id="reset-btn" type="button" title="Remove all players">Reset</button>
    </div>
  </header>

  <main class="board">
    <div id="player-list" class="player-list"></div>
  </main>

  <p class="hint">Drag a player anywhere in the list to reorder, or drag it across the line to activate or bench them. Everything is saved to your browser and encoded into the page URL so you can share or bookmark your roster.</p>

  <script src="app.js"></script>
</body>
</html>
